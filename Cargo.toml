# One Cargo "workspace" holds all three Rust crates so they share one build folder (target/).
[workspace]
resolver = "3"
members = ["src-tauri", "crates/glowby-hook", "crates/glowby-protocol", "crates/glowby-detective"]

[workspace.package]
version = "0.6.1"
edition = "2024"
license = "MIT"

[profile.release]
# Smaller, faster binaries: link-time optimisation + one codegen unit + strip debug symbols.
lto = true
codegen-units = 1
strip = true
opt-level = 3
