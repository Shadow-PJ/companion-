[package]
name = "glowby"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Glowby, a desktop companion for Claude Code"
authors = ["Shadow-PJ"]
repository = "https://github.com/Shadow-PJ/glowby"

[features]
# Plain Cargo builds must bundle the UI too. Tauri dev disables this default.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
# preserve_order keeps your settings.json keys in their original order when we edit it.
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "process", "macros", "rt"] }
similar = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# HTTPS client for optional GitHub CI and public AI Pulse sources.
ureq = { version = "3", features = ["json", "platform-verifier"] }
# Tolerant parsers for public RSS/Atom and benchmark/newsroom HTML.
roxmltree = "0.21"
scraper = "0.24"
notify = "8"
glowby-protocol = { path = "../crates/glowby-protocol" }
glowby-detective = { path = "../crates/glowby-detective" }

[target.'cfg(windows)'.dependencies]
# COM drop target for the hover strip (same crate version Tauri already uses).
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_SystemServices",
  # Windows notifications for important alerts (notify.rs)
  "UI_Notifications",
  "Data_Xml_Dom",
] }
# The #[implement] macro (COM objects) refers to windows_core directly.
windows-core = "0.62"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Credentials",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
